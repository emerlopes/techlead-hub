# Ambiente local (§45.1, §46, RNF-011).
#   pnpm db:up               → só PostgreSQL e Redis, para rodar as apps com `pnpm dev`
#   docker compose up --build → stack completa em http://localhost:3000
name: tech-lead-hub

x-database-url: &database-url postgresql://tech_lead_hub:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/tech_lead_hub

services:
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      target: runtime
    ports:
      # Web vinculada ao loopback: acesso apenas local (§44.6).
      - "127.0.0.1:3000:3000"
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: runtime
    # Sem portas publicadas: a API só é acessível pela rede interna, via web.
    environment:
      DATABASE_URL: *database-url
      WEB_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Aplica as migrations versionadas antes de a API subir.
  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: build
    command: ["pnpm", "--filter", "@tlh/api", "db:deploy"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  planning-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
      target: runtime
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tech_lead_hub
      POSTGRES_USER: tech_lead_hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      # Só loopback, para migrations e testes a partir do host. Nunca exposto publicamente (§44.6).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/compose/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tech_lead_hub -d tech_lead_hub"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
